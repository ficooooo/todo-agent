openapi: 3.1.0
info:
  title: 小明智能体任务 API
  version: 1.1.0
servers:
  - url: http://127.0.0.1:3000
paths:
  /api/tasks:
    get:
      operationId: listTasks
      summary: 按创建顺序列出全部任务，包括已完成任务和子任务
      responses:
        "200":
          description: 任务列表；空列表为 []
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    post:
      operationId: createTask
      summary: 创建一条未完成任务（可选设置截止日期、优先级、工作量或父任务）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { $ref: "#/components/schemas/Title" }
                dueDate: { $ref: "#/components/schemas/DueDate" }
                priority: { $ref: "#/components/schemas/Priority" }
                effort: { $ref: "#/components/schemas/Effort" }
                parentId: { type: string }
      responses:
        "201":
          description: 新建的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTask
      summary: 修改标题、完成状态或扩展属性（传 null 可清空对应扩展属性）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                title: { $ref: "#/components/schemas/Title" }
                done: { type: boolean }
                dueDate:
                  oneOf: [{ $ref: "#/components/schemas/DueDate" }, { type: "null" }]
                priority:
                  oneOf: [{ $ref: "#/components/schemas/Priority" }, { type: "null" }]
                effort:
                  oneOf: [{ $ref: "#/components/schemas/Effort" }, { type: "null" }]
                parentId:
                  type: [string, "null"]
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteTask
      summary: 删除一条任务（若为父任务则一并删除其子任务）
      responses:
        "204":
          description: 删除成功，响应体为空
        "404": { $ref: "#/components/responses/NotFound" }
components:
  schemas:
    Title:
      type: string
      description: 首尾空白会自动去除，去除后长度应为 1 至 200
      minLength: 1
      maxLength: 200
    DueDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: 本地日历日期 YYYY-MM-DD
    Priority:
      type: string
      enum: [low, medium, high]
      description: 优先级（低、中、高）
    Effort:
      type: string
      enum: [small, medium, large]
      description: 预估工作量（小、中、大）
    Task:
      type: object
      required: [id, title, done]
      properties:
        id: { type: string, format: uuid }
        title: { $ref: "#/components/schemas/Title" }
        done: { type: boolean }
        dueDate: { $ref: "#/components/schemas/DueDate" }
        priority: { $ref: "#/components/schemas/Priority" }
        effort: { $ref: "#/components/schemas/Effort" }
        parentId: { type: string, format: uuid }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: 请求字段无效或违反父子任务约束
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
